[package]
name = "constmap"
version = "0.2.0"
edition = "2021"
description = "A static map from strings to u64 values using binary fuse filter construction: smaller and faster than a HashMap, with batched lookups and checksummed serialization"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lemire/rsconstmap"
readme = "README.md"
keywords = ["map", "perfect-hash", "binary-fuse", "static", "lookup"]
categories = ["data-structures", "algorithms"]

[dependencies]
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
tempfile = "3"

[[bench]]
name = "constmap_bench"
harness = false
